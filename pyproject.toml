[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "RAscore"
version = "2026.11"
description = "Retrosynthetic Accessibility (RA) score learned from computer aided synthesis planning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Reymond Group/Molecular AI AstraZeneca", email = "amol.thakkar@dcb.unibe.ch" },
]
dependencies = [
    "scikit-learn",
    "xgboost>=3.4,<3.5",
    "click",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/reymond-group/RAscore"
Repository = "https://github.com/reymond-group/RAscore"
Download = "https://github.com/reymond-group/RAscore"

[project.scripts]
RAscore = "RAscore.command_line_interface:main"

[project.optional-dependencies]
retraining = [
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "scipy",
    "seaborn",
    "swifter",
    "tables",
]
nn = [
    "numpy",
    "torch",
]
nn-tensorflow = [
    "tensorflow",
]
legacy-models = [
    "ModifiedNB",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["RAscore*"]

[tool.setuptools.package-data]
RAscore = [
    "images/*",
    "models/*",
    "models/**/*",
]